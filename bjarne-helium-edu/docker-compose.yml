services:
  app_proxy:
    environment:
      APP_HOST: api
      APP_PORT: 8000

  # MySQL database
  db:
    image: mysql:8.4
    restart: on-failure
    stop_grace_period: 1m
    environment:
      MYSQL_ROOT_PASSWORD: $APP_SEED
      MYSQL_DATABASE: "platform"
      MYSQL_USER: "helium"
      MYSQL_PASSWORD: $APP_SEED
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    healthcheck:
      test: "mysql $$MYSQL_DATABASE -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1;'"
      timeout: 3s
      retries: 20

  # Redis-compatible cache/broker for Celery
  cache:
    image: valkey/valkey:8.1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/cache:/data

  # S3-compatible object storage (emulated locally so no AWS account is required).
  # Swap this out for real AWS S3 + the PLATFORM_AWS_S3_* vars below if you prefer.
  storage:
    image: localstack/localstack:4.13.1
    restart: on-failure
    stop_grace_period: 1m
    environment:
      ENVIRONMENT: "dev-local"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/var/lib/localstack
      - ./container/init-localstack.py:/etc/localstack/init/ready.d/init-localstack.py

  # One-shot init container: runs migrations, static collection, and other setup.
  # Must complete successfully before api/worker start.
  resource:
    build:
      context: .
      target: platform_resource
    environment: &platform-env
      ENVIRONMENT: "dev-local"
      AWS_REGION: "us-east-2"
      PLATFORM_AWS_S3_ENDPOINT_URL: "http://storage:4566"
      PLATFORM_AWS_S3_ACCESS_KEY_ID: "test"
      PLATFORM_AWS_S3_SECRET_ACCESS_KEY: "test"
      PLATFORM_SECRET_KEY: $APP_SEED
      PLATFORM_REDIS_HOST: "redis://cache:6379/1"
      PLATFORM_DB_HOST: "db"
      PLATFORM_DB_USER: "helium"
      PLATFORM_DB_PASSWORD: $APP_SEED
      PLATFORM_DEBUG: "False"
      PLATFORM_TEMPLATE_DEBUG: "False"
      # Fill these in for password-reset/notification emails to work
      PLATFORM_EMAIL_HOST_USER: ""
      PLATFORM_EMAIL_HOST_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      storage:
        condition: service_healthy

  # Django REST API (served by gunicorn on :8000, proxied by app_proxy above)
  api:
    build:
      context: .
      target: platform_api
    restart: on-failure
    stop_grace_period: 1m
    environment: *platform-env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      storage:
        condition: service_healthy
      resource:
        condition: service_completed_successfully

  # Celery worker + beat scheduler for async/scheduled tasks
  worker:
    build:
      context: .
      target: platform_worker
    restart: on-failure
    stop_grace_period: 1m
    environment: *platform-env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      storage:
        condition: service_healthy
      resource:
        condition: service_completed_successfully
