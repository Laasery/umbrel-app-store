manifestVersion: 1
id: bjarne-heliumedu-platform
category: education
name: Helium Student Planner
version: "1.0.0"
tagline: A free, color-coded student planner for classes, homework, and grades
description: >-
  Helium is a free, open-source student planner for organizing classes,
  homework, and grades in one color-coded calendar. This app packages the
  Helium `platform` backend (Django REST API + async worker), the same
  backend that powers the official Helium apps and website.


  Note: this is the API/admin backend only. Pair it with the Helium frontend
  project, or point the official Helium iOS/Android apps at your server's
  address, for the full planner UI.
developer: HeliumEdu
website: https://www.heliumedu.com
dependencies: []
repo: https://github.com/HeliumEdu/platform
support: https://github.com/HeliumEdu/platform/issues
port: 8000
gallery:
